# VARIANT kv070 (2026-10-13, user choice): = ctxmoe16k_mb4 + ctx gpu_memory_utilization 0.80 -> 0.70 for the feat/rl_rc stack. Job 3332907
# OOMed 6 min into the rollout: ctx KVCacheManagerV2.add_dummy_requests -> kv_cache.resume() -> CuOOMError. The startup split (KV 33.2 GiB, torch cap
# 145.4 GiB, ~18 GiB non-torch on 184.3 GiB) left ~2 GiB of slack; 0.70 shrinks the ctx KV pool to ~29 GiB (~6 GiB slack).
# VARIANT (2026-10-13): ctx-only MoE chunk cap 16384 + ctx max_batch_size 4 (user choice after cap 32768 OOMed at
# startup with batch 16, job 3331161, and with batch 4, job 3331804) on top of the DEP16 disagg config below.
# Full 8,192-token ctx step: 16 x 8192 / 16384 = 8 MoE chunks per layer (E1/E1b: 32).
# (identical otherwise to grpo_ultra_swe_trtllm_disagg_dep16.yaml as used by jobs 3113789 / 3308253).
# VARIANT (2026-09-16): DEP16 smoke -- attention data parallel in BOTH the ctx and the gen
# engine (tp 16, moe_ep 16, moe_tp 1, enable_attention_dp true): 32 GPUs = 8 GB200 nodes per
# replica; launch with R=8 GEN_TP=16 (build/launch_S3_ultra_disagg_dep16_smoke.sh). Derived
# from grpo_ultra_swe_trtllm_disagg.yaml; deltas = the base trtllm_cfg parallelism and the two
# role blocks. Exercises PR #18300 (MoE MNNVL/all-to-all workspaces without MPI under Ray).
# ATTEMPT 1 (job 3073288, 2026-09-16) OOMed in fused_moe during the KV-estimation forward:
# under attention DP each rank's experts see up to max_num_tokens x 16 gathered tokens, so the
# MoE chunk cap (moe_config.max_num_tokens 32768) sized a 9.64 GiB workspace against ~5.6 GiB
# free; and the Mamba state slots are unsharded under attention DP (829 MB/slot vs 104 MB under
# TEP8), so the gen engine's max_batch_size 64 alone reserved 53 GB. ATTEMPT 2 deltas: MoE chunk
# cap 4096 (both roles) and gen max_batch_size 16 (+ CUDA graph sizes <= 16). Weights are 133 GiB
# per rank either way (routed experts /16, dense + shared experts replicated).
# VARIANT (2026-09-15): TEP8 + MNNVL + BCG + per-conversation reuse (end-offset 0)
# + PD DISAGGREGATION (1 ctx TP8 + 1 gen TP8 per replica). Derived from
# grpo_ultra_swe_trtllm_tep8_mnnvl_bcg_perconv3_end0.yaml (E0) by adding the
# trtllm_cfg.disaggregation block and use_kv_cache_manager_v2. Base notes follow.
# =============================================================================
# Nemotron Ultra SWE agentic rollout benchmark with TRT-LLM generation backend
# (Lyris/GB200). Derived from grpo_nanov35_swe_trtllm.yaml — same procedure,
# VARIANT (2026-09-06): TEP8 + MNNVL + BCG + per-conversation block reuse
# WITH the required Mamba stable boundary. Byte-identical to
# grpo_ultra_swe_trtllm_tep8_mnnvl_bcg.yaml (job 2909980) except the
# kv_cache_config block (see there). Base variant notes follow.
# BASE VARIANT (2026-09-01): TEP8 + MNNVL + BCG. Deltas vs grpo_ultra_swe_trtllm
# .yaml: moe_ep=8/moe_tp=1 (64 full experts/rank), allreduce MNNVL, breakable
# prefill CUDA graphs (BCG). Everything else inherited from the run-spec
# config (scheduler 8192, MoE GEMM profile 32768, mem 0.8, fp32 mamba cache
# = the standing BCG+MNNVL mitigation, deepseek-r1 parser).
#
# TRT-LLM = CUSTOM nano-bcg wheel, tekit user/shanshan/nano-bcg @ 123a256d64
# (no-F1): MNNVL-under-Ray bootstrap + BCG + mamba2 boundary op + prescale
# fix. Launch with NEMO_RL_VENV_DIR=$PROJ/ray_venvs_mnnvl (pre-built venv).
# HARD RULE: NEVER nsys-profile this config (BCG+MNNVL wedge, 5/5) — NSYS=0.
#
# Launching via run_rollout_benchmark_lyris.sh MUST pass GEN_TP=16: the launcher
# CLI appends tensor_parallel_size=${GEN_TP} (default 4) AFTER this file, and
# moe_tp x moe_ep must equal tp (moe_tp x moe_ep is pinned to 1 x 16 below).
#
# Base schema comes from the gym-run exemplar; everything relevant is
# overridden explicitly below.
# =============================================================================
defaults: "grpo_qwen3_30ba3b_instruct.yaml"

cluster:
  gpus_per_node: 4        # GB200: 4 GPUs/node
  num_nodes: 3            # overridden by launch script
  # Order Ray bundles by NVLink domain / topo_rank so consecutive ranks
  # share an NVLink domain (plain node_id/gpu_id ordering otherwise).
  # Overridden by the launch script to match sbatch --segment.
  segment_size: 1

checkpointing:
  enabled: true
  checkpoint_dir: results/ultra-swe-trtllm   # overridden by launch script
  metric_name: "train:total_reward/mean"
  higher_is_better: true
  keep_top_k: 1000000
  save_period: 5
  checkpoint_must_save_by: "00:03:30:00"   # ruit/Erin default: leaves ~1.5h so an in-flight step can still finish and save
  model_save_format: safetensors
  save_consolidated: false

grpo:
  num_prompts_per_step: 1          # smoke default; baseline=32 via script
  num_generations_per_prompt: 16
  num_val_generations_per_prompt: 2
  max_rollout_turns: 1
  max_num_epochs: 4
  max_num_steps: 1000000
  normalize_rewards: true
  use_leave_one_out_baseline: true
  advantage_clip_low: -100
  advantage_clip_high: 100
  val_period: 10000
  val_at_start: false
  overlong_filtering: false
  val_batch_size: 256
  seed: 42
  # Mask sequences whose generation-vs-training logprob error exceeds this
  # (same scale as the token_mult_prob_error metric). Matches the validated
  # for-gen baseline; leaving it null also makes NeMo-RL skip the prev-logprob
  # pass entirely when force_on_policy_ratio is set (opd.py:120).
  seq_logprob_error_threshold: 2
  penalize_invalid_tool_call: true
  invalid_tool_call_advantage: -5.0
  penalize_malformed_thinking: true
  malformed_thinking_advantage: -5.0
  reward_shaping:
    stop_properly_penalty_coef: null
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false

loss_fn:
  reference_policy_kl_penalty: 0.0
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: true
  use_kl_in_reward: false

policy:
  model_name: /lustre/fsw/coreai_comparch_trtllm/shikiw/models/ultra_stage2sft_step300/
  tokenizer:
    name: ${policy.model_name}
    # Ultra ships its own chat_template.jinja in the checkpoint (byte-identical
    # to nano3.5's); do NOT force qwen-style kwargs here (the base yaml sets
    # enable_thinking for qwen).
    chat_template_kwargs: null
  train_global_batch_size: 16      # smoke default; baseline=512 via script
  train_micro_batch_size: 1
  generation_batch_size: 64
  logprob_batch_size: 1
  max_total_sequence_length: 196608
  precision: bfloat16
  logprob_chunk_size: 1024
  offload_optimizer_for_logprob: false
  dtensor_cfg:
    # lm_policy.save_checkpoint keys the checkpointing_cfg pass-through off
    # dtensor_cfg._v2 even on the Megatron path (swe1 does the same); without
    # this, model_save_format=safetensors is rejected.
    _v2: true
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    # LR-scheduler horizon = max_num_epochs * steps_per_epoch; the launch
    # script recomputes it from the dataset size and PPS.
    train_iters: 48
    activation_checkpointing: true
    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 8   # smoke; baseline=32 via script
    pipeline_model_parallel_size: 1
    context_parallel_size: 2        # smoke; baseline=16 via script
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true
    freeze_moe_router: true
    moe_router_dtype: fp32
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 1.0e-3
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: alltoall
    # for-gen's large-geometry flags (nano-era; unused on the gen-only
    # rollout-benchmark path, which starts no training workers).
    moe_flex_dispatcher_backend: hybridep
    moe_hybridep_num_sms: 32
    moe_shared_expert_overlap: false
    moe_per_layer_logging: true
    use_gloo_process_groups: false
    use_fused_weighted_squared_relu: true
    defer_fp32_logits: true
    calculate_per_token_loss: true
    moe_aux_loss_coeff: 0.0
    apply_rope_fusion: true
    bias_activation_fusion: false
    gradient_accumulation_fusion: false
    mtp_loss_scaling_factor: 0.0
    mtp_num_layers: 0    # RL@main pydantic requires int (MTP disabled anyway)
    optimizer:
      optimizer: adam
      lr: 3.0e-6
      min_lr: 3.0e-6
      weight_decay: 0.0
      bf16: true
      params_dtype: float32
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
    scheduler:
      lr_decay_style: constant
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 3e-7
      override_opt_param_scheduler: true
    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      data_parallel_sharding_strategy: optim_grads_params
    fp8_cfg:
      enabled: false
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1
    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true
  sequence_packing:
    enabled: true
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 64
    fuse_loss: true
  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0

  generation:
    port_range_low: 11001
    port_range_high: 15000
    backend: trtllm
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    trtllm_cfg:
      expose_http_server: true   # required for NeMo-Gym (agents hit the OpenAI server)
      tensor_parallel_size: 16
      # DEP16 (this variant): attention data parallel, moe_tp=1 x moe_ep=16 -- 32 full
      # experts per rank (moe_tp*moe_ep must == tp). One ENGINE spans 4 GB200 nodes
      # (4 GPUs/node); one replica (ctx + gen) spans 8 nodes.
      moe_tensor_parallel_size: 1
      moe_expert_parallel_size: 16
      max_model_len: ${policy.max_total_sequence_length}
      precision: ${policy.precision}
      async_engine: true
      # Dedicated knob for KV free_gpu_memory_fraction (worker maps it via
      # setdefault) — kv_cache_config below must NOT set
      # free_gpu_memory_fraction or that explicit value would win.
      gpu_memory_utilization: 0.8
      max_batch_size: 64
      max_num_tokens: 8192       # scheduler token budget (run spec)
      # Track async-GRPO settings (single source of truth, cannot diverge)
      in_flight_weight_updates: ${grpo.async_grpo.in_flight_weight_updates}
      recompute_kv_cache_after_weight_updates: ${grpo.async_grpo.recompute_kv_cache_after_weight_updates}
      # Ultra's chat_template.jinja is byte-identical to nano3.5's; the run
      # spec pairs the qwen3_coder tool parser with the stock deepseek-r1
      # reasoning parser (<think> split, reasoning_at_start).
      tool_parser: qwen3_coder
      reasoning_parser: deepseek-r1
      default_chat_template_kwargs:
        enable_thinking: true
        truncate_history_thinking: false
        # The model sometimes omits the closing </think>; without this the
        # parser files the whole generation under reasoning_content and the
        # agent receives an empty message (LLMContextWindowExceedError,
        # reward=0).
        force_nonempty_content: true
      # ---------------------------------------------------------------------
      # PD DISAGGREGATION (prepared 2026-09-15 for the design round after E0;
      # not launched in phase 1). One replica = num_context_engines ctx engines
      # + num_generation_engines gen engines behind one DisaggServerActor; the
      # replica count follows from the cluster size (16 GPUs / (8+8) = 1 on R=4).
      # Per-role overrides merge over trtllm_cfg; a role's trtllm_kwargs merge
      # key-by-key over the base trtllm_kwargs below (kv_cache_config stays
      # shared: both roles must agree on block/snapshot layout, and each role's
      # gpu_memory_utilization becomes its free_gpu_memory_fraction).
      # ---------------------------------------------------------------------
      disaggregation:
        enabled: true
        num_context_engines: 1
        num_generation_engines: 1
        # conversation: sticky per trajectory (x-session-id family / body
        # conversation_params / code-point-hash fallback); needed on ctx for
        # cross-turn chain reuse and on gen for the reuse-aware receive.
        ctx_router: conversation
        gen_router: conversation
        num_frontend_workers: 1
        # false in smokes (plain relay); true in formals (base64 token-id relay,
        # no message history on the gen leg -- text-only model, safe).
        gen_tokids_ctxbytes: false
        gen_strip_message_history: false
        frontend_tokenize: false
        # 17300 (branch default) sits inside this recipe's Gym band 15001-20000;
        # 14900 is inside the otherwise unused generation band 11001-15000.
        frontend_base_port: 14900
        # Hybrid Mamba disagg + reuse needs KV cache manager V2, which requires
        # the Python transceiver with the NIXL backend (_util.py); NemotronH has
        # no runtime preference so "auto" would pick C++ -- set PYTHON explicitly.
        cache_transceiver_backend: NIXL
        cache_transceiver_runtime: PYTHON
        max_tokens_in_buffer: 196608          # >= max_model_len (gen-side FCFS admission budget)
        kv_transfer_timeout_ms: 600000        # 60 s default cancels in bulk under step-start bursts
        kv_cache_bounce_size_mb: 0            # per-block path; 384 is the E9 arm
        ctx_trtllm_kwargs:
          # DEP16 for the context engine: attention data parallel across 16 ranks (no TP on
          # attention/Mamba), MoE experts split moe_ep 16 x moe_tp 1 (moe_tp*moe_ep must == tp).
          tensor_parallel_size: 16
          moe_tensor_parallel_size: 1
          moe_expert_parallel_size: 16
          gpu_memory_utilization: 0.70   # kv070 variant (was 0.80; rlrc ctx OOM, job 3332907)
          # 2026-10-13: 16 -> 4. Each per-rank batch slot reserves an unsharded Mamba state (~0.8 GiB); with 16
          # slots the startup profiling forward had 3.34 GiB free and the 9.64 GiB MoE workspace for cap 32768
          # OOMed (job 3331161). 4 slots free ~9.7 GiB. Non-binding here: in E1/E1b the busiest ctx rank never
          # scheduled more than 2 requests per step.
          max_batch_size: 4
          trtllm_kwargs:
            enable_attention_dp: true                    # DEP: attention DP across the 16 ranks
            prefill_cuda_graph_backend: breakable       # BCG on prefill (aggregated best)
            # CTX MoE CHUNK CAP 32768 (2026-10-13, variant of job 3113789/3308253). Under attention DP,
            # ConfigurableMoE chunks by padded rows = 16 ranks x busiest-rank tokens; with the base cap
            # 4096 a full 8,192-token prefill step ran 32 MoE chunks per layer (each re-reading all
            # local expert weights + an all-to-all round); 32768 -> 4 chunks. This replaces the whole
            # base trtllm_kwargs.moe_config (shallow merge in trtllm_worker_async.py), which holds only
            # max_num_tokens. Gen keeps 4096: decode never exceeds 16 x 16 = 256 rows (1 chunk).
            moe_config:
              max_num_tokens: 16384   # 2026-10-13 user choice: 32768 OOMs even with ctx max_batch_size 4 (job 3331804: 7.18 GiB free vs 9.64 needed); 16384 needs 4.82 GiB
            disable_overlap_scheduler: true              # overlap scheduler OFF: upstream ctx recipe
            scheduler_config:
              capacity_scheduler_policy: GUARANTEED_NO_EVICT
            stream_interval: 1                           # ctx leg is non-streaming
            return_perf_metrics: true
            perf_metrics_max_requests: 20000
        gen_trtllm_kwargs:
          # DEP16 for the generation engine: attention data parallel across 16 ranks,
          # moe_ep 16 x moe_tp 1.
          tensor_parallel_size: 16
          moe_tensor_parallel_size: 1
          moe_expert_parallel_size: 16
          gpu_memory_utilization: 0.85
          # Per-rank batch under attention DP; each slot pins an unsharded Mamba state (829 MB),
          # 64 slots = 53 GB fixed KV-pool cost (attempt 1). 16 x 16 ranks = 256 concurrent decodes.
          max_batch_size: 16
          trtllm_kwargs:
            enable_attention_dp: true                    # DEP: attention DP across the 16 ranks
            prefill_cuda_graph_backend: disabled         # gen runs no prefill
            disable_overlap_scheduler: false             # overlap scheduler ON (default; decode win)
            cuda_graph_config:
              enable_padding: true
              batch_sizes: [1, 2, 4, 8, 16]
            scheduler_config:
              capacity_scheduler_policy: GUARANTEED_NO_EVICT
            stream_interval: 10
            return_perf_metrics: true
            perf_metrics_max_requests: 20000
    trtllm_kwargs:
      # Without chunked prefill TRT-LLM rejects any prompt longer than
      # max_num_tokens (8192) with RequestError -> HTTP 400 -> the agent dies
      # the moment it reads a big file. vLLM enables this by default.
      enable_chunked_prefill: true
      # Explicit run-spec pins (plain LlmArgs fields; NeMo-RL's trtllm_cfg
      # TypedDict doesn't declare pp, so it rides the kwargs escape hatch).
      pipeline_parallel_size: 1
      # MoE GEMM profile / chunking cap: at most this many tokens per
      # fused-MoE call (inputs above it are split). Run spec: 32768, 4x the
      # 8192 scheduler budget.
      moe_config:
        max_num_tokens: 4096     # DEP16: bounds the per-chunk MoE workspace (attempt 1 OOM at 32768)
      num_postprocess_workers: 0
      stream_interval: 10
      # Per-iteration observability (rc24 LlmArgs, all default false):
      # print_iter_log emits one logger.info line per executor iteration —
      # requires TLLM_LOG_LEVEL=INFO in the worker env (rc24 default is
      # "error"; the launcher exports it). enable_iter_req_stats only takes
      # effect together with enable_iter_perf_stats.
      print_iter_log: true
      enable_iter_perf_stats: true
      enable_iter_req_stats: true
      # MNNVL allreduce (this variant): ACTIVE only on the custom nano-bcg
      # wheel — it bootstraps the MNNVL workspace via the TP ProcessGroup
      # under Ray (stock rc24 silently falls back to NCCL).
      allreduce_strategy: MNNVL
      # BCG (this variant): breakable prefill CUDA graphs (PR #16609 lineage,
      # nano-validated incl. the mamba2 boundary op). Field exists ONLY on the
      # custom wheel. fp32 SSM below is the standing BCG+MNNVL mitigation;
      # never profile this config with nsys.
      prefill_cuda_graph_backend: breakable
      kv_cache_config:
        # Block reuse validated stable + score-neutral on the rc24 wheel in
        # the nano campaign; adopted as the default upstream (1110ce14).
        enable_block_reuse: true
        # explicit (auto resolves to V2 for hybrid Mamba anyway); V2 is what makes
        # hybrid-Mamba disaggregation with block reuse work on public main.
        use_kv_cache_manager_v2: true
        # free_gpu_memory_fraction intentionally NOT set here — it would
        # override trtllm_cfg.gpu_memory_utilization (0.8) above.
        dtype: auto
        # PER-CONVERSATION REUSE, ATTEMPT 2 (2026-09-06). Attempt 1
        # (2882136/2882137/2883065/2883066) set only the policy: on this hybrid
        # Mamba model the policy validator zeroes the periodic snapshot interval
        # and, with no explicit boundary configured, model_loader.py then turned
        # block reuse OFF entirely (driver log: "Disabling KV cache block reuse
        # for the hybrid Mamba model"; effective enable_block_reuse=False).
        # This attempt adds the explicit stable boundary the docs require.
        # Requests still carry no conversation id, so per-conversation
        # retention (max_num_turns) is inert; effective behaviour = per_request
        # commits + a Mamba snapshot at each prompt end.
        block_reuse_config:
          policy: per_conversation
          max_num_turns: 3
        # rc24 renamed mamba_state_cache_interval to this nested field; setting
        # the legacy name trips a non-idempotent migration validator on
        # re-validation ("Cannot set both ...").
        mamba_state_config:
          # Kept at the baseline value on purpose (user decision 2026-09-06).
          # With policy=per_conversation the KvCacheConfig validator
          # (llm_args.py disable_periodic_mamba_snapshots_for_conversations)
          # forces it to 0 and logs "...is ignored because ...policy=
          # per_conversation...; setting it to 0" -- expected and harmless.
          periodic_snapshot_interval: 8192
          # REQUIRED with per_conversation on a hybrid Mamba model. End offset 0
          # = a Mamba state snapshot at the prompt end (= where the next turn
          # resumes). Without any explicit offset, model_loader.py disables
          # block reuse entirely.
          additional_snapshot_offsets_from_end: [0]
        # float32 per run spec — matches the dtype ultra's config.json
        # declares (the stochastic-rounding knobs only apply to
        # half-precision caches, so they are dropped).
        mamba_ssm_cache_dtype: float32
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 1     # overridden by launch script

data:
  max_input_seq_length: null
  shuffle: false
  num_workers: 1
  use_multiple_dataloader: false
  train:
    data_path: /lustre/fsw/coreai_comparch_trtllm/shikiw/data/swebench_verified_lyris_sif.jsonl
  validation:
    data_path: /lustre/fsw/coreai_comparch_trtllm/shikiw/data/swebench_verified_lyris_sif.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
  _override_: true

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    skip_venv_if_present: true
    port_range_low: 15001
    port_range_high: 20000
    invalid_tool_call_patterns:
      - "<tool_call>"
      - "</tool_call>"
      - "<function_call>"
      - "</function_call>"
    thinking_tags:
      - "<think>"
      - "</think>"
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - responses_api_agents/swe_agents/configs/swebench_openhands_training.yaml
    # Match the validated vllm baseline: keep prior-turn <think> in re-rendered
    # history (truncate_history_thinking=false) to preserve token monotonicity.
    policy_model:
      responses_api_models:
        vllm_model:
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          agent_max_turns: 200
          concurrency: ${mul:2, ${mul:${grpo.num_prompts_per_step}, ${grpo.num_generations_per_prompt}}}
          swebench_agent_timeout: 3600
          run_with_mixed_prompts: true
          dataset_path: ${data.train.data_path}
          apptainer_memory_limit_mb: 65536
          # Lyris-local OpenHands fork with RC6/7/8 arm64-SIF fixes
          agent_framework_repo: /lustre/fsw/coreai_comparch_trtllm/shikiw/nv-OpenHands
          agent_framework_commit: 7644d6785f94f01a5ef4806d9584f07830d4ca53
          container_formatter:
            - "/lustre/fsw/coreai_comparch_trtllm/dominicw/ultra_rollout_bench/swe_sif/swe-bench.eval.arm64.{instance_id}.sif"   # rebuilt/pulled 2026-10-11 (joyang/hsg_s3_data vanished 2026-10-07)
